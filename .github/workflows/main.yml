name: Build VoodooGPIO TigerLake-H

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Intel x86_64 Kext
    runs-on: macos-15-intel

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: Verify Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "===== HOST ====="
          uname -m

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== SDK ====="
          test -f MacKernelSDK/Headers/IOKit/IOLib.h

          echo "===== INTEL HEADER TEST ====="
          printf '#include <IOKit/IOLib.h>\n' \
            | clang++ \
                -arch x86_64 \
                -D__KERNEL__ \
                -DKERNEL \
                -x c++ \
                -E \
                -I "$GITHUB_WORKSPACE/MacKernelSDK/Headers" \
                - >/dev/null

          echo "HEADER TEST PASSED"

      - name: Build Release
        shell: bash
        run: |
          set -uo pipefail

          HEADERS="$GITHUB_WORKSPACE/MacKernelSDK/Headers"
          LIBS="$GITHUB_WORKSPACE/MacKernelSDK/Library/x86_64"

          xcodebuild \
            -project VoodooGPIO.xcodeproj \
            -scheme VoodooGPIO \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            CODE_SIGNING_ALLOWED=NO \
            HEADER_SEARCH_PATHS="$HEADERS" \
            USER_HEADER_SEARCH_PATHS="$HEADERS" \
            SYSTEM_HEADER_SEARCH_PATHS="$HEADERS" \
            OTHER_CFLAGS="-I$HEADERS -D__KERNEL__ -DKERNEL" \
            OTHER_CPLUSPLUSFLAGS="-I$HEADERS -D__KERNEL__ -DKERNEL" \
            LIBRARY_SEARCH_PATHS="$LIBS" \
            build > "$RUNNER_TEMP/build.log" 2>&1

          RESULT=$?

          echo "===== COMPILER ERRORS ====="
          grep -n -B 4 -A 10 -E \
            'error:|fatal error:|BUILD FAILED' \
            "$RUNNER_TEMP/build.log" | head -n 200 || true

          echo "===== BUILD RESULT ====="
          tail -n 60 "$RUNNER_TEMP/build.log"

          exit "$RESULT"

      - name: Verify Tiger Lake-H
        shell: bash
        run: |
          set -euo pipefail

          KEXT="$RUNNER_TEMP/build/Build/Products/Release/VoodooGPIO.kext"
          BIN="$KEXT/Contents/MacOS/VoodooGPIO"
          PLIST="$KEXT/Contents/Info.plist"

          test -f "$BIN"

          echo "===== ARCHITECTURE ====="
          lipo -archs "$BIN" | grep -w x86_64

          echo "===== TIGER LAKE-H CLASS ====="
          nm "$BIN" | grep 'VoodooGPIOTigerLakeH'

          echo "===== INT34C6 MATCH ====="
          /usr/libexec/PlistBuddy \
            -c 'Print :IOKitPersonalities:VoodooGPIOTigerLakeH' \
            "$PLIST" | grep 'INT34C6'

          echo "===== PLIST VALIDATION ====="
          plutil -lint "$PLIST"

      - name: Package Kext
        shell: bash
        run: |
          set -euo pipefail

          KEXT="$RUNNER_TEMP/build/Build/Products/Release/VoodooGPIO.kext"

          mkdir -p "$RUNNER_TEMP/output"

          ditto -c -k --keepParent \
            "$KEXT" \
            "$RUNNER_TEMP/output/VoodooGPIO-TigerLakeH.zip"

      - name: Upload Kext
        uses: actions/upload-artifact@v4
        with:
          name: VoodooGPIO-TigerLakeH-x86_64
          path: ${{ runner.temp }}/output/VoodooGPIO-TigerLakeH.zip
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoodooGPIO-Build-Logs
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
