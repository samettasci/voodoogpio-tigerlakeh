name: Build VoodooGPIO TigerLake-H

on:
  workflow_dispatch:

jobs:
  build:
    name: Build VoodooGPIO
    runs-on: macos-15

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: Show Build Environment
        shell: bash
        run: |
          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== COMPILER ====="
          clang++ --version

          echo "===== PROJECT TARGETS ====="
          xcodebuild -list \
            -project VoodooGPIO.xcodeproj

          echo "===== TIGER LAKE-H SOURCE ====="
          test -f VoodooGPIO/TigerLake-H/VoodooGPIOTigerLakeH.cpp
          test -f VoodooGPIO/TigerLake-H/VoodooGPIOTigerLakeH.hpp

          echo "===== INT34C6 MATCH ====="
          grep -n -B 10 -A 5 \
            'INT34C6' VoodooGPIO/Info.plist

      - name: Build Release
        shell: bash
        run: |
          set -o pipefail

          echo "===== START BUILD ====="

          xcodebuild \
            -project VoodooGPIO.xcodeproj \
            -scheme VoodooGPIO \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/build.log" 2>&1 || {
              echo "===== COMPILER ERRORS ====="

              grep -n -B 5 -A 12 -E \
                'error:|fatal error:|BUILD FAILED' \
                "$RUNNER_TEMP/build.log" \
                | head -n 250 || true

              echo "===== LAST 100 LOG LINES ====="
              tail -n 100 "$RUNNER_TEMP/build.log"

              exit 1
            }

          echo "===== BUILD SUCCEEDED ====="
          tail -n 20 "$RUNNER_TEMP/build.log"

      - name: Locate Built Kext
        shell: bash
        run: |
          KEXT=$(find "$RUNNER_TEMP/build" \
            -type d -name VoodooGPIO.kext \
            | head -n 1)

          if [ -z "$KEXT" ]; then
            echo "ERROR: VoodooGPIO.kext not found"
            exit 1
          fi

          echo "KEXT_PATH=$KEXT" >> "$GITHUB_ENV"

          echo "===== KEXT LOCATION ====="
          echo "$KEXT"

          echo "===== KEXT CONTENTS ====="
          ls -la "$KEXT/Contents"

      - name: Verify Tiger Lake-H
        shell: bash
        run: |
          BIN="$KEXT_PATH/Contents/MacOS/VoodooGPIO"
          PLIST="$KEXT_PATH/Contents/Info.plist"

          echo "===== ARCHITECTURE ====="
          file "$BIN"
          lipo -archs "$BIN"

          echo "===== TIGER LAKE-H CLASS ====="
          nm "$BIN" | grep \
            'VoodooGPIOTigerLakeH' \
            || {
              echo "ERROR: Tiger Lake-H class missing"
              exit 1
            }

          echo "===== INT34C6 MATCH ====="
          /usr/libexec/PlistBuddy \
            -c 'Print :IOKitPersonalities:VoodooGPIOTigerLakeH' \
            "$PLIST"

          echo "===== PLIST VALIDATION ====="
          plutil -lint "$PLIST"

      - name: Package Kext
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/output"

          ditto -c -k --keepParent \
            "$KEXT_PATH" \
            "$RUNNER_TEMP/output/VoodooGPIO-TigerLakeH.zip"

          echo "===== PACKAGE ====="
          ls -lh "$RUNNER_TEMP/output"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoodooGPIO-TigerLakeH-x86_64
          path: ${{ runner.temp }}/output/VoodooGPIO-TigerLakeH.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VoodooGPIO-Build-Logs
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
