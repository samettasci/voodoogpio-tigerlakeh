name: Build VoodooGPIO TigerLake-H

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: Verify SDK Paths
        shell: bash
        run: |
          set -e

          echo "===== WORKSPACE ====="
          pwd

          echo "===== KERNEL HEADER ====="
          test -f "$PWD/MacKernelSDK/Headers/IOKit/IOLib.h"
          ls -l "$PWD/MacKernelSDK/Headers/IOKit/IOLib.h"

          echo "===== XCODE ====="
          xcodebuild -version

      - name: Build Release
        shell: bash
        run: |
          set -o pipefail

          SDK_HEADERS="$PWD/MacKernelSDK/Headers"
          SDK_LIB="$PWD/MacKernelSDK/Library/x86_64"

          xcodebuild \
            -project VoodooGPIO.xcodeproj \
            -scheme VoodooGPIO \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            CODE_SIGNING_ALLOWED=NO \
            HEADER_SEARCH_PATHS="$SDK_HEADERS" \
            LIBRARY_SEARCH_PATHS="$SDK_LIB" \
            build > "$RUNNER_TEMP/build.log" 2>&1

          RESULT=$?

          echo "===== BUILD ERRORS ====="
          grep -n -B 4 -A 10 -E \
            'error:|fatal error:|BUILD FAILED' \
            "$RUNNER_TEMP/build.log" | head -n 200 || true

          echo "===== BUILD RESULT ====="
          tail -n 35 "$RUNNER_TEMP/build.log"

          exit "$RESULT"

      - name: Verify and Package
        shell: bash
        run: |
          set -e

          KEXT="$RUNNER_TEMP/build/Build/Products/Release/VoodooGPIO.kext"
          BIN="$KEXT/Contents/MacOS/VoodooGPIO"
          PLIST="$KEXT/Contents/Info.plist"

          test -f "$BIN"

          echo "===== ARCHITECTURE ====="
          lipo -archs "$BIN"

          echo "===== TIGER LAKE-H CLASS ====="
          nm "$BIN" | grep 'VoodooGPIOTigerLakeH'

          echo "===== INT34C6 MATCH ====="
          /usr/libexec/PlistBuddy \
            -c 'Print :IOKitPersonalities:VoodooGPIOTigerLakeH' \
            "$PLIST" | grep 'INT34C6'

          echo "===== PACKAGE ====="
          mkdir -p "$RUNNER_TEMP/output"

          ditto -c -k --keepParent \
            "$KEXT" \
            "$RUNNER_TEMP/output/VoodooGPIO-TigerLakeH.zip"

      - name: Upload Kext
        uses: actions/upload-artifact@v4
        with:
          name: VoodooGPIO-TigerLakeH-x86_64
          path: ${{ runner.temp }}/output/VoodooGPIO-TigerLakeH.zip
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoodooGPIO-Build-Logs
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
