name: Build VoodooGPIO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project VoodooGPIO.xcodeproj

      - - name: Build Release
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project VoodooGPIO.xcodeproj \
            -scheme VoodooGPIO \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/build.log" 2>&1 || {
              echo "===== GERCEK DERLEME HATALARI ====="
              grep -n -B 5 -A 12 -E \
                'error:|fatal error:|BUILD FAILED' \
                "$RUNNER_TEMP/build.log" | head -n 180 || true

              echo "===== SON 60 SATIR ====="
              tail -n 60 "$RUNNER_TEMP/build.log"
              exit 1
            }

          echo "===== BUILD SUCCESS ====="
          tail -n 10 "$RUNNER_TEMP/build.log"

      - name: Verify Tiger Lake-H
        run: |
          BIN=$(find "$RUNNER_TEMP/build" -type f -path "*/VoodooGPIO.kext/Contents/MacOS/VoodooGPIO" | head -n 1)
          test -n "$BIN"
          nm "$BIN" | grep 'VoodooGPIOTigerLakeH'
          file "$BIN"

      - name: Package
        run: |
          find "$RUNNER_TEMP/build" -name VoodooGPIO.kext -type d \
            -exec ditto -c -k --keepParent {} "$RUNNER_TEMP/VoodooGPIO.zip" \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoodooGPIO-TigerLakeH
          path: ${{ runner.temp }}/VoodooGPIO.zip
          if-no-files-found: error
