name: VoodooGPIO Intel Build V4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    name: Build TigerLake-H x86_64
    runs-on: macos-15-intel

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: Verify Environment V4
        shell: bash
        run: |
          set -euo pipefail

          echo "===== WORKFLOW VERSION V4 ====="
          echo "===== BRANCH ====="
          echo "$GITHUB_REF_NAME"

          echo "===== COMMIT ====="
          git rev-parse HEAD

          echo "===== ARCHITECTURE ====="
          uname -m
          test "$(uname -m)" = "x86_64"

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== SDK HEADERS ====="
          SDK="$GITHUB_WORKSPACE/MacKernelSDK/Headers"
          test -f "$SDK/IOKit/IOLib.h"
          ls -l "$SDK/IOKit/IOLib.h"

          echo "===== SDK LIBRARY ====="
          test -f \
            "$GITHUB_WORKSPACE/MacKernelSDK/Library/x86_64/libkmod.a"

          echo "===== TIGERLAKE-H SOURCE ====="
          test -f \
            VoodooGPIO/TigerLake-H/VoodooGPIOTigerLakeH.cpp

          echo "===== INT34C6 ====="
          grep -n 'INT34C6' VoodooGPIO/Info.plist

          echo "ENVIRONMENT CHECK PASSED V4"

      - name: Build Release V4
        shell: bash
        run: |
          set -uo pipefail

          HEADERS="$GITHUB_WORKSPACE/MacKernelSDK/Headers"
          LIBS="$GITHUB_WORKSPACE/MacKernelSDK/Library/x86_64"

          echo "===== STARTING INTEL BUILD V4 ====="

          xcodebuild \
            -project VoodooGPIO.xcodeproj \
            -scheme VoodooGPIO \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            KERNEL_EXTENSION_HEADER_SEARCH_PATHS="$HEADERS" \
            KERNEL_FRAMEWORK_HEADERS="$HEADERS" \
            HEADER_SEARCH_PATHS="$HEADERS" \
            USER_HEADER_SEARCH_PATHS="$HEADERS" \
            OTHER_CFLAGS="-I$HEADERS" \
            OTHER_CPLUSPLUSFLAGS="-I$HEADERS" \
            LIBRARY_SEARCH_PATHS="$LIBS" \
            build > "$RUNNER_TEMP/build.log" 2>&1

          RESULT=$?

          echo "===== REAL COMPILER ERRORS ====="
          grep -n -B 5 -A 10 -E \
            'error:|fatal error:|BUILD FAILED|Undefined symbols' \
            "$RUNNER_TEMP/build.log" \
            | head -n 250 || true

          echo "===== LAST 80 LINES ====="
          tail -n 80 "$RUNNER_TEMP/build.log"

          echo "===== EXIT STATUS ====="
          echo "$RESULT"

          exit "$RESULT"

      - name: Verify TigerLake-H Binary
        shell: bash
        run: |
          set -euo pipefail

          KEXT="$RUNNER_TEMP/build/Build/Products/Release/VoodooGPIO.kext"
          BIN="$KEXT/Contents/MacOS/VoodooGPIO"
          PLIST="$KEXT/Contents/Info.plist"

          echo "===== KEXT EXISTS ====="
          test -f "$BIN"

          echo "===== ARCHITECTURE ====="
          file "$BIN"
          lipo -archs "$BIN" | grep -w x86_64

          echo "===== TIGERLAKE-H CLASS ====="
          nm -a "$BIN" > "$RUNNER_TEMP/symbols.txt"
          grep 'VoodooGPIOTigerLakeH' \
            "$RUNNER_TEMP/symbols.txt"

          echo "===== INT34C6 PERSONALITY ====="
          /usr/libexec/PlistBuddy \
            -c 'Print :IOKitPersonalities:VoodooGPIOTigerLakeH' \
            "$PLIST" | grep 'INT34C6'

          echo "===== PLIST VALIDATION ====="
          plutil -lint "$PLIST"

          echo "===== VERIFICATION PASSED ====="

      - name: Package Kext
        shell: bash
        run: |
          set -euo pipefail

          KEXT="$RUNNER_TEMP/build/Build/Products/Release/VoodooGPIO.kext"

          mkdir -p "$RUNNER_TEMP/output"

          ditto -c -k --keepParent \
            "$KEXT" \
            "$RUNNER_TEMP/output/VoodooGPIO-TigerLakeH.zip"

          ls -lh "$RUNNER_TEMP/output"

      - name: Upload Compiled Kext
        uses: actions/upload-artifact@v4
        with:
          name: VoodooGPIO-TigerLakeH-x86_64
          path: ${{ runner.temp }}/output/VoodooGPIO-TigerLakeH.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoodooGPIO-Build-Logs-V4
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
