name: Build VoodooGPIO TigerLake-H

on:
  workflow_dispatch:

jobs:
  build:
    name: Build VoodooGPIO
    runs-on: macos-15

    steps:
      - name: Checkout VoodooGPIO
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: Check Environment
        shell: bash
        run: |
          set -e

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== SDK ====="
          xcodebuild -showsdks

          echo "===== KERNEL HEADERS ====="
          test -f MacKernelSDK/Headers/IOKit/IOLib.h
          ls -l MacKernelSDK/Headers/IOKit/IOLib.h

          echo "===== KMOD LIBRARY ====="
          test -f MacKernelSDK/Library/x86_64/libkmod.a

          echo "===== TIGER LAKE-H ====="
          test -f VoodooGPIO/TigerLake-H/VoodooGPIOTigerLakeH.cpp

          echo "===== PROJECT ====="
          xcodebuild -list -project VoodooGPIO.xcodeproj

      - name: Build Release
        id: compile
        shell: bash
        run: |
          set -o pipefail

          SDK_HEADERS="$GITHUB_WORKSPACE/MacKernelSDK/Headers"
          SDK_LIB="$GITHUB_WORKSPACE/MacKernelSDK/Library/x86_64"

          echo "===== START BUILD ====="

          xcodebuild \
            -project VoodooGPIO.xcodeproj \
            -scheme VoodooGPIO \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            CODE_SIGNING_ALLOWED=NO \
            KERNEL_EXTENSION_HEADER_SEARCH_PATHS="$SDK_HEADERS" \
            KERNEL_FRAMEWORK_HEADERS="$SDK_HEADERS" \
            HEADER_SEARCH_PATHS="$SDK_HEADERS" \
            LIBRARY_SEARCH_PATHS="$SDK_LIB" \
            build > "$RUNNER_TEMP/build.log" 2>&1

          RESULT=$?

          echo "===== COMPILER ERRORS ====="
          grep -n -B 5 -A 12 -E \
            'error:|fatal error:|BUILD FAILED' \
            "$RUNNER_TEMP/build.log" \
            | head -n 250 || true

          echo "===== BUILD LOG TAIL ====="
          tail -n 80 "$RUNNER_TEMP/build.log"

          exit "$RESULT"

      - name: Locate Kext
        if: success()
        shell: bash
        run: |
          set -e

          KEXT=$(find "$RUNNER_TEMP/build/Build/Products/Release" \
            -type d -name VoodooGPIO.kext \
            | head -n 1)

          test -n "$KEXT"
          test -f "$KEXT/Contents/MacOS/VoodooGPIO"

          echo "KEXT_PATH=$KEXT" >> "$GITHUB_ENV"

          echo "===== KEXT FOUND ====="
          echo "$KEXT"

      - name: Verify Tiger Lake-H
        if: success()
        shell: bash
        run: |
          set -e

          BIN="$KEXT_PATH/Contents/MacOS/VoodooGPIO"
          PLIST="$KEXT_PATH/Contents/Info.plist"

          echo "===== BINARY ARCH ====="
          file "$BIN"
          lipo -archs "$BIN"

          echo "===== TIGER LAKE-H CLASS ====="
          nm "$BIN" | grep -q 'VoodooGPIOTigerLakeH'

          echo "===== CLASS STRING ====="
          strings "$BIN" | grep 'VoodooGPIOTigerLakeH'

          echo "===== INT34C6 PERSONALITY ====="
          /usr/libexec/PlistBuddy \
            -c 'Print :IOKitPersonalities:VoodooGPIOTigerLakeH' \
            "$PLIST"

          echo "===== PLIST VALIDATION ====="
          plutil -lint "$PLIST"

          echo "===== VERIFICATION PASSED ====="

      - name: Package Kext
        if: success()
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/output"

          ditto -c -k --keepParent \
            "$KEXT_PATH" \
            "$RUNNER_TEMP/output/VoodooGPIO-TigerLakeH.zip"

          ls -lh "$RUNNER_TEMP/output"

      - name: Upload Kext Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoodooGPIO-TigerLakeH-x86_64
          path: ${{ runner.temp }}/output/VoodooGPIO-TigerLakeH.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Full Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoodooGPIO-Full-Build-Log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
